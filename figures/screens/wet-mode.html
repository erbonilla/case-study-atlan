<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wet Mode — Atlan Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --abyss: #0B2A3C;
  --abyss-deep: #061a26;
  --abyss-92: rgba(11, 42, 60, 0.92);
  --abyss-72: rgba(11, 42, 60, 0.72);
  --abyss-56: rgba(11, 42, 60, 0.56);
  --abyss-40: rgba(11, 42, 60, 0.40);
  --abyss-24: rgba(11, 42, 60, 0.24);
  --abyss-16: rgba(11, 42, 60, 0.16);
  --abyss-08: rgba(11, 42, 60, 0.08);
  --tide: #0E8A9A;
  --tide-deep: #0A6F7D;
  --tide-soft: #BFE0E5;
  --coral: #FF6A3D;
  --coral-bright: #FF7E50;
  --foam: #ECF7F8;
  --foam-warm: #F4FAFB;
  --paper: #FBFCFC;
  --display: 'Fraunces', 'Georgia', serif;
  --body: 'Manrope', 'Helvetica Neue', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--abyss);
  font-family: var(--body);
  color: var(--abyss);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

.page {
  min-height: 100vh;
  padding: 64px 32px;
  background:
    radial-gradient(ellipse 800px 600px at 20% 20%, rgba(14, 138, 154, 0.08), transparent 60%),
    radial-gradient(ellipse 600px 500px at 85% 80%, rgba(255, 106, 61, 0.04), transparent 55%),
    var(--abyss);
  display: flex;
  align-items: flex-start;
  justify-content: center;
}
.page::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode: overlay;
}

.wetmode-card {
  width: 100%;
  max-width: 1200px;
  background: var(--foam);
  border-radius: 4px;
  position: relative;
  overflow: hidden;
  box-shadow:
    0 1px 2px rgba(0, 0, 0, 0.4),
    0 32px 80px -16px rgba(0, 0, 0, 0.5),
    0 0 0 1px rgba(255, 255, 255, 0.04);
}
.wetmode-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 96px;
  height: 3px;
  background: var(--coral);
  z-index: 5;
}

/* HEADER */
.card-header {
  padding: 56px 64px 32px;
}

/* CONTEXT BAND */
.context-band {
  position: relative;
  margin: 0;
  width: 100%;
  aspect-ratio: 21 / 9;
  overflow: hidden;
  isolation: isolate;
}
.context-band img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.context-caption {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 8px;
  padding: 28px 32px;
  background: linear-gradient(180deg, transparent 0%, transparent 50%, rgba(11, 42, 60, 0.85) 100%);
  color: var(--foam);
}
.context-tag {
  font-family: var(--body);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--coral);
}
.context-body {
  font-family: var(--display);
  font-style: italic;
  font-size: 18px;
  line-height: 1.45;
  max-width: 720px;
  color: rgba(236, 247, 248, 0.94);
}
.eyebrow {
  display: block;
  font-family: var(--body);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--tide-deep);
  margin-bottom: 24px;
}
.card-title {
  font-family: var(--display);
  font-size: 64px;
  font-weight: 500;
  font-variation-settings: 'opsz' 144;
  line-height: 1.0;
  letter-spacing: -0.025em;
  color: var(--abyss);
  margin-bottom: 14px;
}
.card-subtitle {
  font-family: var(--display);
  font-size: 19px;
  font-weight: 400;
  font-style: italic;
  font-variation-settings: 'opsz' 96;
  color: var(--abyss-72);
  line-height: 1.45;
  max-width: 720px;
}

/* SECTION HEADERS */
.section-eyebrow {
  font-family: var(--body);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--tide-deep);
  margin-bottom: 14px;
}
.section-title {
  font-family: var(--display);
  font-size: 32px;
  font-weight: 500;
  font-variation-settings: 'opsz' 96;
  line-height: 1.15;
  letter-spacing: -0.018em;
  color: var(--abyss);
  margin-bottom: 32px;
  max-width: 580px;
}

/* LO-FI SECTION */
.lofi-section {
  padding: 32px 64px 56px;
  border-top: 1px solid var(--abyss-08);
  border-bottom: 1px solid var(--abyss-08);
  background:
    repeating-linear-gradient(
      135deg,
      transparent,
      transparent 20px,
      rgba(11, 42, 60, 0.02) 20px,
      rgba(11, 42, 60, 0.02) 21px
    );
}

.lofi-comparison {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 40px;
  align-items: center;
  margin-top: 16px;
}

.lofi-side {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  position: relative;
}

.lofi-side-label {
  font-family: var(--body);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--abyss-56);
  padding: 5px 12px;
  border: 1px solid var(--abyss-24);
  border-radius: 100px;
}
.lofi-side.wet .lofi-side-label {
  border-color: var(--coral);
  color: var(--coral);
}

/* LO-FI PHONE WIREFRAME */
.lofi-phone {
  width: 240px;
  height: 500px;
  border: 1.5px solid var(--abyss-56);
  border-radius: 28px;
  padding: 16px 12px;
  background: #fff;
  position: relative;
}
.lofi-phone::before {
  content: '';
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 56px;
  height: 5px;
  background: var(--abyss-56);
  border-radius: 4px;
}

.lofi-screen {
  width: 100%;
  height: 100%;
  padding-top: 12px;
}

/* LO-FI STANDARD MODE elements */
.lofi-block {
  border: 1px dashed var(--abyss-40);
  background: var(--abyss-08);
  border-radius: 3px;
  margin-bottom: 6px;
  font-family: var(--body);
  font-size: 8.5px;
  color: var(--abyss-56);
  font-weight: 500;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 0.04em;
}
.lofi-block.solid {
  background: var(--abyss-16);
  border-style: solid;
}
.lofi-row {
  display: flex;
  gap: 4px;
  margin-bottom: 6px;
}

/* LO-FI STANDARD layout */
.std-header { height: 22px; }
.std-eyebrow { height: 14px; width: 60%; margin: 0 auto 6px; font-size: 7.5px; }
.std-title { height: 22px; width: 90%; margin: 0 auto 10px; }
.std-set-row { height: 28px; }
.std-set-row.active { background: var(--tide-soft); border-style: solid; border-color: var(--tide); color: var(--tide-deep); font-weight: 600; }
.std-divider { height: 1px; background: var(--abyss-16); margin: 8px 0; border: none; }
.std-stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-bottom: 6px; }
.std-stat-grid .lofi-block { height: 30px; font-size: 7.5px; }
.std-control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 6px; }
.std-control-grid .lofi-block { height: 22px; font-size: 7.5px; }
.std-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 4px; }
.std-nav .lofi-block { height: 20px; font-size: 7px; }

/* LO-FI WET MODE elements */
.wet-eyebrow {
  height: 16px;
  width: 70%;
  margin: 12px auto 18px;
  font-size: 7.5px;
}
.wet-top-half {
  height: 200px;
  border: 1.5px solid var(--abyss-72);
  background: var(--foam);
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
  position: relative;
}
.wet-top-half::after {
  content: 'DISPLAY ONLY';
  position: absolute;
  top: 6px;
  left: 8px;
  font-size: 6.5px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--abyss-56);
}
.wet-top-half .lofi-block {
  border: none;
  background: transparent;
  margin: 0;
  font-weight: 700;
  font-size: 18px;
  color: var(--abyss);
  width: 90px;
  height: 30px;
}
.wet-top-half .wet-set { font-size: 9px; color: var(--abyss-56); margin-bottom: 4px; height: 14px; }
.wet-top-half .wet-display { font-size: 24px; height: 40px; }
.wet-top-half .wet-pace { font-size: 10px; height: 16px; color: var(--abyss-72); }

.wet-bottom-half {
  height: 200px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-top: 6px;
}
.wet-action-zone {
  border: 1.5px solid var(--abyss-72);
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}
.wet-action-zone.left { background: var(--abyss-08); }
.wet-action-zone.right { background: var(--coral); border-color: var(--coral); }
.wet-action-zone .arrow {
  font-size: 22px;
  font-weight: 700;
  color: var(--abyss);
  margin-bottom: 6px;
}
.wet-action-zone.right .arrow { color: #fff; }
.wet-action-zone .label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--abyss);
}
.wet-action-zone.right .label { color: #fff; }

/* COMPARISON ARROW */
.comparison-arrow {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.comparison-arrow .arrow-icon {
  width: 48px;
  height: 48px;
  border: 1.5px solid var(--coral);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--display);
  font-size: 22px;
  color: var(--coral);
  font-weight: 500;
  background: var(--foam);
}
.comparison-arrow .arrow-label {
  font-family: var(--body);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--coral);
  white-space: nowrap;
}

/* LO-FI ANNOTATIONS */
.lofi-annotations {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 0 4px;
}
.annotation {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  font-family: var(--body);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.45;
  color: var(--abyss-72);
  letter-spacing: 0.005em;
}
.annotation-mark {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--abyss);
  color: var(--foam);
  font-size: 10px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 1px;
}
.lofi-side.wet .annotation-mark { background: var(--coral); }
.annotation strong {
  display: block;
  color: var(--abyss);
  font-weight: 700;
  margin-bottom: 2px;
  letter-spacing: 0;
}

/* HI-FI SECTION */
.hifi-section {
  padding: 56px 64px;
  background: var(--foam);
}

.hifi-display {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 48px;
  align-items: center;
  margin-top: 16px;
}

.hifi-annotations {
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.hifi-annotation {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.hifi-annotation .annot-label {
  font-family: var(--body);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--tide-deep);
}
.hifi-annotation .annot-title {
  font-family: var(--display);
  font-size: 18px;
  font-weight: 500;
  font-variation-settings: 'opsz' 60;
  color: var(--abyss);
  line-height: 1.25;
  letter-spacing: -0.005em;
}
.hifi-annotation .annot-body {
  font-family: var(--body);
  font-size: 13px;
  font-weight: 500;
  color: var(--abyss-72);
  line-height: 1.5;
  letter-spacing: 0.005em;
}

/* HI-FI PHONE */
.hifi-phone-wrap {
  display: flex;
  justify-content: center;
  position: relative;
}
.hifi-phone {
  width: 340px;
  height: 720px;
  background: #0d0d0e;
  border-radius: 44px;
  padding: 12px;
  position: relative;
  box-shadow:
    0 1px 0 1px rgba(255, 255, 255, 0.04),
    0 24px 64px -8px rgba(0, 0, 0, 0.35),
    0 4px 8px rgba(0, 0, 0, 0.15);
}
.hifi-phone::before {
  content: '';
  position: absolute;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  width: 110px;
  height: 26px;
  background: #0d0d0e;
  border-radius: 100px;
  z-index: 2;
}

.hifi-screen {
  width: 100%;
  height: 100%;
  background: var(--abyss-deep);
  border-radius: 32px;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* Status row (top) */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 28px 0;
  font-family: var(--body);
  font-size: 13px;
  font-weight: 600;
  color: var(--foam);
}
.status-bar .right { display: flex; gap: 6px; align-items: center; }

/* Offline pill */
.offline-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 36px auto 0;
  padding: 6px 12px;
  background: rgba(14, 138, 154, 0.18);
  border: 1px solid rgba(14, 138, 154, 0.5);
  border-radius: 100px;
  font-family: var(--body);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--tide-soft);
  width: fit-content;
}
.offline-pill .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #5BB37C;
  box-shadow: 0 0 8px rgba(91, 179, 124, 0.6);
}

/* Top half — display */
.display-block {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 24px;
  text-align: center;
}
.display-eyebrow {
  font-family: var(--body);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: rgba(236, 247, 248, 0.55);
  margin-bottom: 24px;
}
.display-distance {
  font-family: var(--display);
  font-size: 144px;
  font-weight: 600;
  font-variation-settings: 'opsz' 144;
  line-height: 0.85;
  letter-spacing: -0.04em;
  color: var(--foam);
  margin-bottom: 4px;
}
.display-intensity {
  font-family: var(--body);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--tide-soft);
  margin-bottom: 36px;
}
.display-timer-row {
  display: flex;
  align-items: baseline;
  gap: 20px;
  margin-bottom: 4px;
}
.display-timer {
  font-family: var(--display);
  font-size: 64px;
  font-weight: 500;
  font-variation-settings: 'opsz' 96;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--foam);
}
.display-timer .live-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--coral);
  margin-right: 8px;
  vertical-align: middle;
  margin-bottom: 8px;
  box-shadow: 0 0 12px rgba(255, 106, 61, 0.6);
}
.display-target {
  font-family: var(--body);
  font-size: 13px;
  font-weight: 600;
  color: rgba(236, 247, 248, 0.55);
  letter-spacing: 0.02em;
}
.display-target strong {
  color: var(--foam);
  font-weight: 700;
}

/* Bottom half — action zone */
.action-half {
  height: 280px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-top: 1px solid rgba(236, 247, 248, 0.10);
  position: relative;
}
.action-half::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  width: 1px;
  height: 100%;
  background: rgba(236, 247, 248, 0.08);
}
.action-zone {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
  gap: 14px;
  position: relative;
}
.action-zone.left {
  background: rgba(236, 247, 248, 0.04);
}
.action-zone.right {
  background: linear-gradient(180deg, rgba(255, 106, 61, 0.06) 0%, rgba(255, 106, 61, 0.18) 100%);
}
.action-icon {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--foam);
  font-size: 24px;
  font-weight: 300;
}
.action-zone.right .action-icon {
  color: var(--coral-bright);
}
.action-label {
  font-family: var(--body);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--foam);
}
.action-zone.right .action-label {
  color: var(--coral-bright);
}
.action-direction {
  font-family: var(--body);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(236, 247, 248, 0.4);
  margin-top: 4px;
}
.action-zone.right .action-direction {
  color: rgba(255, 126, 80, 0.5);
}

/* Swipe progress track at the very bottom */
.swipe-hint {
  position: absolute;
  bottom: 28px;
  left: 24px;
  right: 24px;
  height: 4px;
  border-radius: 100px;
  background: rgba(236, 247, 248, 0.06);
  overflow: hidden;
}
.swipe-hint::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--foam);
  box-shadow: 0 0 0 4px rgba(11, 42, 60, 0.9);
}
.swipe-hint-label {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--body);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: rgba(236, 247, 248, 0.35);
}

/* SPEC PANEL */
.specs-panel {
  padding: 48px 64px;
  background: var(--abyss);
  color: var(--foam);
}
.specs-panel .section-eyebrow { color: var(--tide-soft); }
.specs-panel .section-title { color: var(--foam); margin-bottom: 24px; }

.specs-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border-left: 1px solid rgba(236, 247, 248, 0.12);
}
.spec-item {
  padding: 24px 24px;
  border-right: 1px solid rgba(236, 247, 248, 0.12);
  border-top: 1px solid rgba(236, 247, 248, 0.12);
  border-bottom: 1px solid rgba(236, 247, 248, 0.12);
}
.spec-label {
  font-family: var(--body);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--tide-soft);
  margin-bottom: 14px;
}
.spec-value {
  font-family: var(--display);
  font-size: 36px;
  font-weight: 500;
  font-variation-settings: 'opsz' 96;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--foam);
  margin-bottom: 10px;
}
.spec-value .unit {
  font-family: var(--body);
  font-size: 14px;
  font-weight: 600;
  color: rgba(236, 247, 248, 0.5);
  letter-spacing: 0.02em;
  margin-left: 4px;
