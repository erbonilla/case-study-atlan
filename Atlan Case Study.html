    // No-flash theme: resolve and apply before first paint.
    (function () {
      try {
        var t = localStorage.getItem('atlan-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var r = document.documentElement;
        r.dataset.theme = t;
        r.style.colorScheme = t;
      } catch (e) {}
    })();
  </script>
