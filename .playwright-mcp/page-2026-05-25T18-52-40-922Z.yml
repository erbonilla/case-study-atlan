        - heading "The endurance-tech market has solved two problems well, and neither of them is The Optimizer's." [level=2] [ref=e152]:
          - text: The endurance-tech market has solved two problems well, and
          - emphasis [ref=e153]: neither of them
          - text: is The Optimizer's.
        - paragraph [ref=e154]:
          - text: Deep-science platforms bury users in periodization telemetry. Social-tracking platforms gamify training into public performance. The Optimizer needs both sides — the rigor
          - emphasis [ref=e155]: and
          - text: the adherence support — and neither product is built for them.
      - generic [ref=e156]:
        - generic [ref=e157]:
          - generic [ref=e158]: The two existing positions
          - list [ref=e159]:
            - listitem [ref=e160]:
              - strong [ref=e161]: Deep-science platforms
              - text: (TrainingPeaks) assume the user has the bandwidth to interpret a CTL/ATL/TSB curve at 9 PM. They have the rigor; they lack the empathy.
            - listitem [ref=e162]:
              - strong [ref=e163]: Social-tracking platforms
              - text: (Strava) use kudos, streaks, and leaderboards as the adherence mechanism. They have the warmth; they lack the depth.
            - listitem [ref=e164]:
              - strong [ref=e165]: Swim-specific apps
              - text: (MySwimPro) split the difference; they do not anchor either pole.
            - listitem [ref=e166]:
              - strong [ref=e167]: Sensor companions
              - text: (FORM) measure beautifully but do not coach.
